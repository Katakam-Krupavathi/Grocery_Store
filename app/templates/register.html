{% extends 'base.html' %}

{% block title %}Register - FreshMart Grocery{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-success fs-1"></i>
            <h3 class="fw-bold mt-2">Create Account</h3>
            <p class="text-muted small">Join FreshMart for fresh deals & fast delivery</p>
          </div>

          <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="nameInput" class="form-label">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nameInput" required placeholder="John Doe">
              </div>
            </div>

            <div class="mb-3">
              <label for="emailInput" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="emailInput" required placeholder="name@example.com">
              </div>
            </div>

            <div class="mb-4">
              <label for="passwordInput" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="passwordInput" required placeholder="At least 6 characters" minlength="6">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-semibold">
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              <span id="btnText">Create Account</span>
            </button>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('main.login_page') }}" class="text-success fw-semibold">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('registerAlert');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    alertBox.classList.add('d-none');
    spinner.classList.remove('d-none');
    btnText.textContent = ' Creating account...';
    submitBtn.disabled = true;

    const name = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    try {
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, email, password })
      });

      const data = await response.json();

      if (response.ok) {
        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
        }
        showToast('Account created successfully! Redirecting...');
        setTimeout(() => {
          window.location.href = '/products';
        }, 600);
      } else {
        alertBox.textContent = data.msg || 'Registration failed. Please try again.';
        alertBox.classList.remove('d-none');
      }
    } catch (err) {
      alertBox.textContent = 'An unexpected error occurred. Please try again.';
      alertBox.classList.remove('d-none');
    } finally {
      spinner.classList.add('d-none');
      btnText.textContent = 'Create Account';
      submitBtn.disabled = false;
    }
  });
</script>
{% endblock %}
